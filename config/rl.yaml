policy_agent:
  max_memory: 100000
  batch_size: 256  # Smaller batch for more frequent updates
  lr: 1.0e-3  # Higher LR for simpler state space (was 5e-4)
  hidden_state: 128  # Smaller network for 6-dim input (was 256)
  epsilon_start: 0.95  # Very high initial exploration to break mode collapse
  epsilon_min: 0.10  # Higher minimum to maintain exploration
  epsilon_decay: 0.999  # Even slower decay
  gamma: 0.99  # Higher discount for long-term planning
  alpha: 0.9  # RMSprop alpha
  entropy_coef: 0.02  # Entropy bonus for exploration
  train_every_iteration: 5  # Train more frequently
  value_for_end_game:
    __type__: models.rl_agent.agent.ValueForEndGame
    value: "last_action"
  iterations: 80000
  min_deaths_to_record: 60

env: 
  __type__: PongGame.env.GameEnvironment
  game:
    __type__: PongGame.game.PongGame